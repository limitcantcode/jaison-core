# Prompter
prompter:
  instruction_prompt_filename: 'example.txt'
  character_prompt_filename: 'example.txt'
  scene_prompt_filename: 'example.txt'

  character_name: "J.A.I.son"
  name_translations:
    "old name": "new name"
  history_length: 20

# Spacy NLP
spacy_model: en_core_web_sm
