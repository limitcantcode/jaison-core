# Enabled operations
# Uncomment the ones you want to use by default
operations:
# STT
# - role: stt
#   id: azure
#   language: en-US # https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=stt
# - role: stt
#   id: fish
# - role: stt
#   id: whispercpp
#   model_filepath: E:\\jaison-core\\models\\whispercpp\\ggml-base.en.bin
#   language: en
#   temperature: 0.0
#   response_format: json
- role: stt
  id: openai # Openai STT https://platform.openai.com/docs/guides/speech-to-text
  base_url: https://api.openai.com/v1/
  model: gpt-4o-transcribe
  language: en # https://github.com/openai/whisper/blob/main/whisper/tokenizer.py
  
  # T2T
# - role: t2t
#   id: llamacpp
#   model_filepath: E:\\jaison-core\\models\\llamacpp\\your-model.gguf
#   ctx_size: 2048
#   n_predict: 256
#   temperature: 0.8
#   top_p: 0.95
#   top_k: 40
#   dry_multiplier: 0.5
#   samplers: [dry, top_k, typ_p, top_p, min_p, temperature]
- role: t2t
  id: openai
  base_url: https://api.openai.com/v1/
  model: gpt-4o
  temperature: 1
  top_p: 0.9
  presence_penalty: 1
  frequency_penalty: 1

  # Text filters
- role: filter_text
  id: filter_clean
- role: filter_text
  id: emotion_roberta
- role: filter_text
  id: mod_koala
- role: filter_text
  id: chunker_sentence

